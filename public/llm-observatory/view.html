<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Expanding Universe of LLMs · Foxxe Labs</title>
<!--
  Embed shim for the homepage hero.

  The standalone page now lives at /llm-observatory/view/ (src/pages/llm-observatory/view.astro)
  so it gets the real site chrome, nav and theme toggle. This file exists only to
  serve the hero iframe on the homepage, which wants a bare globe with no chrome
  behind the hero copy. Anyone who lands here directly is sent to the real page.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: fixed; inset: 0; }
  /* The globe is a fixed 1920x1080 design; scale it to fit the hero, centered. */
  #frame { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; border: 0; transform-origin: center; }
</style>
</head>
<body>
  <div id="stage">
    <iframe id="frame" title="The Expanding Universe of Large Language Models" allow="autoplay"></iframe>
  </div>
  <script>
  (function () {
    var embedded = window.self !== window.top;
    if (!embedded) {                       // direct hit → the real page
      location.replace('/llm-observatory/view/');
      return;
    }

    var f = document.getElementById('frame');
    // bare=1 drops the globe's own header and panels so it sits cleanly behind
    // the hero copy; the animated timeline stays.
    //
    // The hero is pinned to the dark globe on purpose. The homepage lays a dark
    // scrim over this frame so the white hero copy stays legible, so a pale globe
    // underneath would read as a washed-out mistake rather than a light theme.
    // It behaves like a dark hero image. The standalone page at
    // /llm-observatory/view/ is the one that follows the site theme.
    f.src = './index.html?bare=1&theme=dark';

    function fit() {
      var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      f.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();

    var tries = 0;
    function start() {
      try {
        var d = f.contentDocument;
        var btns = [].slice.call(d.querySelectorAll('button'));
        var play = btns.filter(function (x) { return x.textContent.trim() === '▶'; })[0];
        if (play) {
          play.click();
          var sp = btns.filter(function (x) { return x.textContent.trim() === '1×'; })[0];
          if (sp) sp.click();              // 2x in the hero so it blooms quickly
          return;
        }
      } catch (e) {}
      if (tries++ < 60) setTimeout(start, 300);
    }

    f.addEventListener('load', function () {
      fit();
      setTimeout(start, 500);
      // loop the timeline so the hero keeps blooming
      setInterval(function () {
        try {
          var d = f.contentDocument;
          var rb = [].slice.call(d.querySelectorAll('button'))
            .filter(function (x) { return x.textContent.trim() === '↻'; })[0];
          if (rb) rb.click();
        } catch (e) {}
      }, 2000);
    });
  })();
  </script>
</body>
</html>
