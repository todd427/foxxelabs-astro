const DECAY = 0.62;
const MIN_OPACITY = 0.04;
let _audioCtx = null;
let soundEnabled = true;
let privacyMode = false;

// ── Privacy mode ──────────────────────────────────────────────────────────────
// Maps blob colour to a generic category label shown instead of the real title.
const COLOR_LABEL = {
  '#E8A020': 'Writing',
  '#1D9E75': 'Project',
  '#534AB7': 'Personal',
  '#BA7517': 'Engineering',
  '#5F5E5A': 'General',
};

function blobDisplayTitle(d) {
  if (!privacyMode) return d.r > 20 ? (d.convTitle.length > 24 ? d.convTitle.slice(0, 22) + '…' : d.convTitle) : '';
  return d.r > 20 ? (COLOR_LABEL[d.color] || 'Activity') : '';
}

function refreshPrivacy() {
  blobLayer.selectAll('g.blob').select('text.lbl')
    .text(d => blobDisplayTitle(d));
  // Hide tooltip on mode switch
  document.getElementById('tooltip').style.opacity = '0';
  document.getElementById('privacy-banner').classList.toggle('visible', privacyMode);
  const btn = document.getElementById('privacy-btn');
  btn.classList.toggle('active', privacyMode);
  btn.title = privacyMode ? 'Privacy mode ON — click to show details' : 'Privacy mode — hides project names';
}

document.getElementById('privacy-btn').addEventListener('click', function() {
  getAudioCtx();
  privacyMode = !privacyMode;
  refreshPrivacy();
});

function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

function playBlobSound(convHeat, sparse) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const freq = 800 * Math.pow(110 / 800, convHeat);
    const decay = 0.06 + convHeat * 0.49;
    const gain = 0.06 + convHeat * 0.18;
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.connect(env); env.connect(ctx.destination);
    if (sparse) {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * 1.5, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 2.2, now + decay * 0.3);
      env.gain.setValueAtTime(gain * 0.6, now);
      env.gain.exponentialRampToValueAtTime(0.0001, now + decay * 1.4);
    } else {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq * 1.2, now);
      osc.frequency.exponentialRampToValueAtTime(freq, now + 0.015);
      env.gain.setValueAtTime(gain, now);
      env.gain.exponentialRampToValueAtTime(gain * 0.3, now + 0.015);
      env.gain.exponentialRampToValueAtTime(0.0001, now + decay);
    }
    osc.start(now); osc.stop(now + decay * 1.5);
  } catch(e) {}
}

document.getElementById('sound-btn').addEventListener('click', function() {
  soundEnabled = !soundEnabled;
  this.textContent = soundEnabled ? '🔊' : '🔇';
  this.style.opacity = soundEnabled ? '0.8' : '0.25';
  if (soundEnabled) getAudioCtx();
});

function getColor(label) {
  const l = label.toLowerCase();
  if (/writing session|rocket city|word count|words written|pages:|progress:|daily average/.test(l)) return '#E8A020';
  if (/legion|anseo|dissertation|aislinge|mnemos|leargas|radharc|survey|research|community|afterwords|toddbot|foxxe|sceal|foghlaim/.test(l)) return '#1D9E75';
  if (/overwhelm|fear|inadequ|anxiet|personal|reflect|tension|desire|emotion|pressure|validat|ireland|citizen|moving|naturaliz/.test(l)) return '#534AB7';
  if (/code|debug|django|git|python|script|api|deploy|error|fix|oauth|dns|server|typescript|javascript|vllm|llama|cuda|model|build|pipeline|classifier|slam|bridge/.test(l)) return '#BA7517';
  return '#5F5E5A';
}

function getRadius(convHeat, weight) {
  const base = 10 + convHeat * 65;
  const boost = Math.sqrt(weight) * 0.3;
  return Math.max(10, Math.min(75, base + base * boost));
}

const svg = d3.select('#svg');
const blobLayer = d3.select('#blob-layer');
const tooltip = document.getElementById('tooltip');
let W = 0, H = 0;

function categoryX(color) {
  const w = W || 800;
  if (color === '#1D9E75') return w * 0.28;
  if (color === '#534AB7') return w * 0.72;
  if (color === '#BA7517') return w * 0.50;
  if (color === '#E8A020') return w * 0.50;
  return w * 0.50;
}

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth; H = wrap.clientHeight;
  svg.attr('viewBox', `0 0 ${W} ${H}`);
  sim.force('center', d3.forceCenter(W/2, H/2).strength(0.02));
  sim.force('x', d3.forceX(d => categoryX(d.color)).strength(d => d.active ? 0.07 : 0.01));
  sim.force('y', d3.forceY(H/2).strength(d => d.active ? 0.02 : 0.005));
  sim.alpha(0.3).restart();
}

const sim = d3.forceSimulation([])
  .force('charge', d3.forceManyBody().strength(d => d.active ? -d.r * 4 : -d.r * 1.5))
  .force('collide', d3.forceCollide().radius(d => d.active ? d.r + 5 : d.r * 0.6 + 2).strength(0.6))
  .force('center', d3.forceCenter(400, 300).strength(0.02))
  .force('x', d3.forceX(400).strength(0.05))
  .force('y', d3.forceY(300).strength(0.02))
  .alphaDecay(0.02).velocityDecay(0.5)
  .on('tick', () => { blobLayer.selectAll('g.blob').attr('transform', d => `translate(${d.x.toFixed(1)},${d.y.toFixed(1)})`); });

const registry = new Map();
let decayClock = 0;

function showPeriod(idx) {
  const period = PERIODS[idx];
  if (!period) return;
  currentIdx = idx;
  document.getElementById('scrubber').value = idx;
  document.getElementById('time-label').textContent = period.period;
  document.getElementById('period-label').textContent = period.period;
  document.getElementById('doc-count').textContent = period.doc_count > 0 ? `${period.doc_count.toLocaleString()} memories` : 'quiet';
  const isEmpty = period.empty || period.doc_count === 0;
  if (!isEmpty) decayClock++;
  const activeNodes = (period.components || []).map(c => {
    const color = getColor(c.label);
    const r = getRadius(c.conv_heat || 0, c.weight);
    return { id: c.conv_title || c.label.slice(0, 48), label: c.label, convTitle: c.conv_title || c.label.slice(0, 48), convHeat: c.conv_heat || 0, weight: c.weight, sparse: !!c.sparse, color, r, docCount: period.doc_count, period: period.period };
  });
  const activeIds = new Set(activeNodes.map(n => n.id));
  for (const node of activeNodes) {
    const existing = registry.get(node.id);
    if (existing) { Object.assign(existing, node); existing.active = true; existing.lastSeenIdx = decayClock; existing.targetOpacity = 1.0; }
    else { registry.set(node.id, { ...node, active: true, lastSeenIdx: decayClock, targetOpacity: 1.0, currentOpacity: 0.0, x: categoryX(node.color) + (Math.random() - 0.5) * 100, y: (H || 400) / 2 + (Math.random() - 0.5) * 100, vx: 0, vy: 0, _isNew: true }); }
  }
  for (const [id, entry] of registry) {
    if (!activeIds.has(id)) {
      entry.active = false;
      if (!isEmpty) { entry.targetOpacity = Math.pow(DECAY, decayClock - entry.lastSeenIdx); }
      if (entry.targetOpacity < MIN_OPACITY) registry.delete(id);
    }
  }
  const newBlobs = [...registry.values()].filter(e => e._isNew);
  newBlobs.forEach((d, i) => { setTimeout(() => playBlobSound(d.convHeat, d.sparse), i * 60); delete d._isNew; });
  const allNodes = [...registry.values()];
  const join = blobLayer.selectAll('g.blob').data(allNodes, d => d.id);
  join.exit().transition().duration(400).ease(d3.easeCubicIn).style('opacity', 0).remove();
  const enterG = join.enter().append('g').attr('class', 'blob').attr('transform', d => `translate(${d.x},${d.y})`).style('opacity', 0).style('cursor', 'pointer');
  enterG.append('circle').attr('class', 'halo').attr('r', d => d.r * 1.7).attr('fill', d => d.color + '12').attr('filter', 'url(#glow)');
  enterG.append('circle').attr('class', 'main').attr('r', d => d.r).attr('fill', d => d.sparse ? 'none' : d.color + 'c0').attr('stroke', d => d.color).attr('stroke-width', d => d.sparse ? 1.5 : 0).attr('stroke-dasharray', d => d.sparse ? '5,4' : 'none').attr('filter', d => d.convHeat > 0.5 ? 'url(#glow-soft)' : 'none');
  enterG.append('text').attr('class', 'lbl').attr('text-anchor', 'middle').attr('dy', '0.35em').attr('pointer-events', 'none').attr('fill', 'rgba(255,255,255,0.85)').attr('font-size', d => Math.max(7, Math.min(13, d.r * 0.28)) + 'px').text(d => blobDisplayTitle(d));
  const allG = enterG.merge(join);
  allG.on('mouseenter', function(event, d) {
    if (privacyMode) {
      // In privacy mode: show only category + heat level, no title
      tooltip.style.opacity = '1';
      document.getElementById('tip-title').textContent = COLOR_LABEL[d.color] || 'Activity';
      document.getElementById('tip-heat').textContent = d.active
        ? `${d.convHeat > 0.6 ? 'high' : d.convHeat > 0.3 ? 'medium' : 'low'} engagement`
        : `fading (${(d.targetOpacity * 100).toFixed(0)}% strength)`;
      document.getElementById('tip-weight').textContent = d.sparse ? 'first appearance' : `period weight ${(d.weight * 100).toFixed(1)}%`;
      document.getElementById('tip-meta').textContent = `${d.period} · ${d.docCount.toLocaleString()} memories`;
    } else {
      tooltip.style.opacity = '1';
      document.getElementById('tip-title').textContent = d.convTitle;
      document.getElementById('tip-heat').textContent = d.active ? `heat ${(d.convHeat * 100).toFixed(0)}% — ${d.convHeat > 0.6 ? 'deeply explored' : d.convHeat > 0.3 ? 'substantial' : 'brief'}` : `memory — fading (${(d.targetOpacity * 100).toFixed(0)}% strength)`;
      document.getElementById('tip-weight').textContent = d.sparse ? 'first appearance' : `period weight ${(d.weight * 100).toFixed(1)}%`;
      document.getElementById('tip-meta').textContent = `${d.period} · ${d.docCount.toLocaleString()} docs`;
    }
  }).on('mousemove', e => { tooltip.style.left = (e.clientX + 18) + 'px'; tooltip.style.top = (e.clientY - 52) + 'px'; }).on('mouseleave', () => { tooltip.style.opacity = '0'; });
  allG.transition().duration(700).ease(d3.easeCubicOut).style('opacity', d => d.targetOpacity).style('pointer-events', d => d.active ? 'all' : 'none');
  allG.select('circle.main').transition().duration(700).ease(d3.easeCubicOut).attr('r', d => d.active ? d.r : d.r * 0.75).attr('fill', d => d.sparse ? 'none' : d.color + 'c0');
  allG.select('circle.halo').transition().duration(700).attr('r', d => d.active ? d.r * 1.7 : d.r * 1.1);
  allG.select('text.lbl').transition().duration(700).attr('font-size', d => Math.max(7, Math.min(13, d.r * 0.28)) + 'px').style('opacity', d => d.active ? 1 : 0).text(d => blobDisplayTitle(d));
  sim.force('x', d3.forceX(d => categoryX(d.color)).strength(d => d.active ? 0.07 : 0.008));
  sim.force('y', d3.forceY(H / 2).strength(d => d.active ? 0.02 : 0.004));
  sim.force('charge', d3.forceManyBody().strength(d => d.active ? -d.r * 4 : -d.r));
  sim.nodes(allNodes);
  sim.alpha(0.5).restart();
}

const PLAY_INTERVAL = 2500;
let currentIdx = 0, playing = false, playTimer = null;

function togglePlay() {
  getAudioCtx(); playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';
  if (playing) { playTimer = setInterval(() => { showPeriod((currentIdx + 1) % PERIODS.length); }, PLAY_INTERVAL); }
  else { clearInterval(playTimer); playTimer = null; }
}

window.addEventListener('resize', resize);
document.getElementById('play-btn').addEventListener('click', togglePlay);
document.getElementById('scrubber').addEventListener('input', function() { getAudioCtx(); if (playing) togglePlay(); showPeriod(parseInt(this.value)); });
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') { getAudioCtx(); showPeriod(Math.min(currentIdx+1, PERIODS.length-1)); }
  if (e.key === 'ArrowLeft') { getAudioCtx(); showPeriod(Math.max(currentIdx-1, 0)); }
});
document.getElementById('scrubber').max = PERIODS.length - 1;
resize();
showPeriod(0);
</script>
