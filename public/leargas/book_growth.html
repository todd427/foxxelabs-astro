// ── Audio ─────────────────────────────────────────────────────────────────────
let _audioCtx = null;
let soundEnabled = true;

function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

function playBlobSound(weight) {
  if (!soundEnabled) return;
  try {
    const ctx  = getAudioCtx();
    const now  = ctx.currentTime;
    const freq = 800 * Math.pow(110 / 800, weight);
    const decay = 0.06 + weight * 0.49;
    const gain  = 0.06 + weight * 0.18;
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.connect(env); env.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq * 1.2, now);
    osc.frequency.exponentialRampToValueAtTime(freq, now + 0.015);
    env.gain.setValueAtTime(gain, now);
    env.gain.exponentialRampToValueAtTime(gain * 0.3, now + 0.015);
    env.gain.exponentialRampToValueAtTime(0.0001, now + decay);
    osc.start(now); osc.stop(now + decay * 1.5);
  } catch(e) {}
}

document.getElementById('sound-btn').addEventListener('click', function() {
  soundEnabled = !soundEnabled;
  this.textContent = soundEnabled ? '🔊' : '🔇';
  this.style.opacity = soundEnabled ? '0.8' : '0.25';
  if (soundEnabled) getAudioCtx();
});

// ── Speed ─────────────────────────────────────────────────────────────────────
const SPEED_MS = { 1: 1200, 2: 800, 3: 400, 4: 200, 5: 100 };
let PLAY_INTERVAL = SPEED_MS[3];

document.getElementById('speed-slider').addEventListener('input', function() {
  const v = parseInt(this.value);
  PLAY_INTERVAL = SPEED_MS[v];
  document.getElementById('speed-label').textContent = v + '×';
  if (playing) {
    clearInterval(playTimer);
    playTimer = setInterval(() => {
      const next = (currentIdx + 1) % TIMELINE.length;
      showPeriod(next);
    }, PLAY_INTERVAL);
  }
});

function stageAtDate(book, dateStr) {
  const ms = book.milestones;
  if (ms.published && dateStr >= ms.published) return 'published';
  if (ms.kdp       && dateStr >= ms.kdp)       return 'kdp';
  if (ms.cover     && dateStr >= ms.cover)     return 'cover';
  return 'drafting';
}

function wcAtDate(book, dateStr) {
  // Latest word count entry on or before dateStr
  let wc = 0;
  for (const e of book.entries) {
    if (e.date <= dateStr && e.word_count > wc) wc = e.word_count;
  }
  return wc;
}

function radius(wc) {
  if (!wc) return 6;
  return Math.max(6, Math.min(60, 6 + (Math.log10(wc + 1) / Math.log10(150001)) * 54));
}

function stableJitter(title) {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) >>> 0;
  return ((h % 1000) / 1000 - 0.5);
}

function fmtWc(n) {
  if (!n) return 'no word count yet';
  return n >= 1000 ? (n / 1000).toFixed(1) + 'k words' : n + ' words';
}

function fmtStage(s) {
  return {drafting:'Drafting',cover:'Cover stage',kdp:'KDP / Print',published:'Published'}[s] || s;
}

// ── Build timeline ────────────────────────────────────────────────────────────
// Monthly steps from earliest first_entry to today
function buildTimeline() {
  const dates = BOOKS.map(b => b.first_entry).filter(Boolean).sort();
  if (!dates.length) return [];
  const start = new Date(dates[0]);
  start.setDate(1);
  const end = new Date();
  end.setDate(1);
  const months = [];
  const cur = new Date(start);
  while (cur <= end) {
    months.push(cur.toISOString().slice(0, 7)); // YYYY-MM
    cur.setMonth(cur.getMonth() + 1);
  }
  return months;
}

const TIMELINE = buildTimeline();

// ── SVG layout ────────────────────────────────────────────────────────────────
const svg       = d3.select('#svg');
const blobLayer = d3.select('#blob-layer');
const tooltip   = document.getElementById('tooltip');
let W = 0, H = 0;

function bookY(title) {
  const midY  = H / 2;
  const range = H * 0.7;
  return midY + stableJitter(title) * range;
}

// Stable X position per book — based on pen name cluster
function bookX(book) {
  const jitter = stableJitter(book.title + 'x') * (W * 0.15);
  if (book.pen_name && book.pen_name.toLowerCase().includes('talla')) {
    return W * 0.72 + jitter;
  }
  return W * 0.30 + jitter;
}

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  svg.attr('viewBox', `0 0 ${W} ${H}`);
}

// ── D3 force sim for blob separation ─────────────────────────────────────────
const sim = d3.forceSimulation([])
  .force('collide', d3.forceCollide().radius(d => d.r + 4).strength(0.7))
  .force('x', d3.forceX(d => d.tx).strength(0.12))
  .force('y', d3.forceY(d => d.ty).strength(0.08))
  .alphaDecay(0.03).velocityDecay(0.55)
  .on('tick', () => {
    blobLayer.selectAll('g.book')
      .attr('transform', d => `translate(${d.x.toFixed(1)},${d.y.toFixed(1)})`);
  });

// Registry of live nodes keyed by title
const registry = new Map();

// ── Show a single period ──────────────────────────────────────────────────────
let currentIdx = 0;

function showPeriod(idx) {
  const dateStr = TIMELINE[idx];
  if (!dateStr) return;
  currentIdx = idx;

  document.getElementById('scrubber').value = idx;
  document.getElementById('time-label').textContent = dateStr;
  document.getElementById('period-label').textContent = dateStr.slice(0, 7);

  // Determine which books are active (first_entry <= dateStr)
  const active = BOOKS.filter(b => b.first_entry && b.first_entry.slice(0, 7) <= dateStr);

  // Update registry
  for (const book of active) {
    const wc    = wcAtDate(book, dateStr + '-31'); // end of month
    const stage = stageAtDate(book, dateStr + '-31');
    const r     = radius(wc);
    const fill  = STAGE_COLOUR[stage] || '#4a9eff';

    if (registry.has(book.title)) {
      const node = registry.get(book.title);
      node.wc    = wc;
      node.stage = stage;
      node.r     = r;
      node.fill  = fill;
      node.tx    = bookX(book);
      node.ty    = bookY(book.title);
    } else {
      const node = {
        title:    book.title,
        penName:  book.pen_name,
        wc, stage, r, fill,
        tx: bookX(book), ty: bookY(book.title),
        x:  bookX(book) + (Math.random() - 0.5) * 40,
        y:  bookY(book.title) + (Math.random() - 0.5) * 40,
        vx: 0, vy: 0,
        book,
        _new: true,
      };
      registry.set(book.title, node);
    }
  }

  // Compute maxR for audio weight
  const maxR = Math.max(...[...registry.values()].map(n => n.r), 1);

  // Sound for new blobs
  const newBlobs = [...registry.values()].filter(n => n._new);
  newBlobs.forEach((d, i) => {
    setTimeout(() => playBlobSound(d.r / maxR), i * 60);
    delete d._new;
  });

  const nodes = [...registry.values()];

  // D3 join
  const join = blobLayer.selectAll('g.book').data(nodes, d => d.title);

  // EXIT — books that somehow got removed (shouldn't happen but safety)
  join.exit().transition().duration(300).style('opacity', 0).remove();

  // ENTER
  const enterG = join.enter()
    .append('g').attr('class', 'book')
    .attr('transform', d => `translate(${d.x},${d.y})`)
    .style('opacity', 0).style('cursor', 'pointer');

  enterG.append('circle').attr('class', 'halo')
    .attr('r', 0).attr('fill', d => d.fill + '18').attr('filter', 'url(#glow)');

  enterG.append('circle').attr('class', 'main')
    .attr('r', 0).attr('fill', d => d.fill + 'b0')
    .attr('stroke', d => d.fill).attr('stroke-width', 1);

  enterG.append('text').attr('class', 'lbl')
    .attr('text-anchor', 'middle').attr('dy', '0.35em')
    .attr('pointer-events', 'none')
    .attr('fill', 'rgba(255,255,255,0.8)')
    .attr('font-size', '9px')
    .style('opacity', 0);

  const allG = enterG.merge(join);

  // Tooltip
  allG.on('mouseenter', function(event, d) {
    tooltip.style.opacity = '1';
    document.getElementById('tip-title').textContent = d.title;
    document.getElementById('tip-stage').textContent = fmtStage(d.stage);
    document.getElementById('tip-stage').style.color  = d.fill;
    document.getElementById('tip-wc').textContent    = fmtWc(d.wc);
    document.getElementById('tip-meta').textContent  =
      `${d.penName} · started ${d.book.first_entry || '?'}`;
  })
  .on('mousemove', e => {
    tooltip.style.left = (e.clientX + 18) + 'px';
    tooltip.style.top  = (e.clientY - 50) + 'px';
  })
  .on('mouseleave', () => { tooltip.style.opacity = '0'; });

  // Animate
  allG.transition().duration(600).ease(d3.easeCubicOut)
    .style('opacity', 1);

  allG.select('circle.main').transition().duration(600).ease(d3.easeCubicOut)
    .attr('r', d => d.r)
    .attr('fill', d => d.fill + 'b0')
    .attr('stroke', d => d.fill);

  allG.select('circle.halo').transition().duration(600)
    .attr('r', d => d.r * 1.8)
    .attr('fill', d => d.fill + '18');

  allG.select('text.lbl')
    .text(d => d.r > 22 ? (d.title.length > 20 ? d.title.slice(0, 18) + '…' : d.title) : '')
    .transition().duration(600)
    .attr('font-size', d => Math.max(7, Math.min(11, d.r * 0.24)) + 'px')
    .style('opacity', d => d.r > 22 ? 1 : 0);

  // Update sim
  sim.nodes(nodes);
  sim.force('x', d3.forceX(d => d.tx).strength(0.12));
  sim.force('y', d3.forceY(d => d.ty).strength(0.08));
  sim.force('collide', d3.forceCollide().radius(d => d.r + 4).strength(0.7));
  sim.alpha(0.4).restart();
}

// ── Playback ──────────────────────────────────────────────────────────────────
let playing = false, playTimer = null;

function togglePlay() {
  getAudioCtx();
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';
  if (playing) {
    playTimer = setInterval(() => {
      const next = (currentIdx + 1) % TIMELINE.length;
      showPeriod(next);
    }, PLAY_INTERVAL);
  } else {
    clearInterval(playTimer); playTimer = null;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  resize();
  svg.attr('viewBox', `0 0 ${W} ${H}`);

  if (!TIMELINE.length) {
    document.getElementById('period-label').textContent = 'no data';
    return;
  }

  document.getElementById('scrubber').max = TIMELINE.length - 1;
  document.getElementById('play-btn').addEventListener('click', togglePlay);
  document.getElementById('scrubber').addEventListener('input', function() {
    if (playing) togglePlay();
    showPeriod(parseInt(this.value));
  });
  document.addEventListener('keydown', e => {
    if (e.key === ' ')          { e.preventDefault(); togglePlay(); }
    if (e.key === 'ArrowRight') showPeriod(Math.min(currentIdx + 1, TIMELINE.length - 1));
    if (e.key === 'ArrowLeft')  showPeriod(Math.max(currentIdx - 1, 0));
  });
  window.addEventListener('resize', () => {
    resize();
    registry.clear();
    blobLayer.selectAll('*').remove();
    sim.nodes([]);
    showPeriod(currentIdx);
  });

  // Start at the beginning
  showPeriod(0);
}

init();
</script>
</body>
</html>
