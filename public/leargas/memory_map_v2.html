let _audioCtx = null;

function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

function playBlobSound(convHeat, sparse) {
  if (!soundEnabled) return;
  try {
    const ctx  = getAudioCtx();
    const now  = ctx.currentTime;
    const freq = 800 * Math.pow(110 / 800, convHeat);
    const decay = 0.06 + convHeat * 0.49;
    const gain  = 0.06 + convHeat * 0.18;
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.connect(env); env.connect(ctx.destination);
    if (sparse) {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * 1.5, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 2.2, now + decay * 0.3);
      env.gain.setValueAtTime(gain * 0.6, now);
      env.gain.exponentialRampToValueAtTime(0.0001, now + decay * 1.4);
    } else {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq * 1.2, now);
      osc.frequency.exponentialRampToValueAtTime(freq, now + 0.015);
      env.gain.setValueAtTime(gain, now);
      env.gain.exponentialRampToValueAtTime(gain * 0.3, now + 0.015);
      env.gain.exponentialRampToValueAtTime(0.0001, now + decay);
    }
    osc.start(now); osc.stop(now + decay * 1.5);
  } catch(e) {}
}

  soundEnabled = !soundEnabled;
  this.textContent = soundEnabled ? '🔊' : '🔇';
  this.style.opacity = soundEnabled ? '0.8' : '0.25';
  if (soundEnabled) getAudioCtx();
});

// ── Git helpers ──────────────────────────────────────────────────────────────
function getGitBoost(convTitle) {
  const t = convTitle.toLowerCase();
  let total = 0;
  for (const [repo, keywords] of Object.entries(REPO_LABELS)) {
    if (keywords.some(k => t.includes(k))) total += repoCumulative[repo] || 0;
  }
  return total;
}

function getActiveCommits(convTitle, gitActivity) {
  if (!gitActivity) return 0;
  const t = convTitle.toLowerCase();
  let total = 0;
  for (const [repo, keywords] of Object.entries(REPO_LABELS)) {
    if (keywords.some(k => t.includes(k))) total += gitActivity[repo] || 0;
  }
  return total;
}

// ── Layout ───────────────────────────────────────────────────────────────────
function getRadius(convHeat, weight, gitBoost) {
  const base  = 10 + convHeat * 65;
  const boost = Math.sqrt(weight) * 0.3;
  const gitR  = gitBoost > 0 ? Math.log(gitBoost + 1) * 3.5 : 0;
  return Math.max(10, Math.min(95, base + base * boost + gitR));
}

const svg       = d3.select('#svg');
const blobLayer = d3.select('#blob-layer');
const tooltip   = document.getElementById('tooltip');
let W = 0, H = 0;

// X grouping by source colour
function categoryX(source) {
  const w = W || 800;
  const c = srcColour(source);
  // Spread sources across the canvas
  const keys = Object.keys(SOURCE_COLOURS);
  const idx  = keys.indexOf(source);
  if (idx < 0) return w * 0.5;
  const step = w / (keys.length + 1);
  return step * (idx + 1);
}

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth; H = wrap.clientHeight;
  svg.attr('viewBox', `0 0 ${W} ${H}`);
  sim.force('center', d3.forceCenter(W/2, H/2).strength(0.02));
  sim.force('x', d3.forceX(d => categoryX(d.source)).strength(d => d.active ? 0.07 : 0.01));
  sim.force('y', d3.forceY(H/2).strength(d => d.active ? 0.02 : 0.005));
  sim.alpha(0.3).restart();
}

const sim = d3.forceSimulation([])
  .force('charge',  d3.forceManyBody().strength(d => d.active ? -d.r * 4 : -d.r * 1.5))
  .force('collide', d3.forceCollide().radius(d => d.active ? d.r + 5 : d.r * 0.6 + 2).strength(0.6))
  .force('center',  d3.forceCenter(400, 300).strength(0.02))
  .force('x',       d3.forceX(400).strength(0.05))
  .force('y',       d3.forceY(300).strength(0.02))
  .alphaDecay(0.02).velocityDecay(0.5)
  .on('tick', () => {
    blobLayer.selectAll('g.blob')
      .attr('transform', d => `translate(${d.x.toFixed(1)},${d.y.toFixed(1)})`);
  });

// ── Detail panel ─────────────────────────────────────────────────────────────
const detailPanel = document.getElementById('detail-panel');
document.getElementById('detail-close').addEventListener('click', () => {
  detailPanel.classList.remove('open');
});

function showDetail(d) {
  document.getElementById('d-label').textContent = d.convTitle;
  const srcEl = document.getElementById('d-source');
  srcEl.textContent = 'Source: ' + srcLabel(d.source);
  srcEl.style.color = srcColour(d.source);
  document.getElementById('d-weight').textContent =
    `Weight: ${(d.weight * 100).toFixed(1)}%  ·  ${d.period}`;
  const docsEl = document.getElementById('d-docs');
  docsEl.innerHTML = '';
  (d.topDocs || []).forEach(doc => {
    const div = document.createElement('div');
    div.className = 'd-doc';
    div.textContent = doc;
    docsEl.appendChild(div);
  });
  detailPanel.classList.add('open');
}

// ── Blob registry ────────────────────────────────────────────────────────────
const registry = new Map();
let decayClock = 0;

function showPeriod(idx) {
  const period = PERIODS[idx];
  if (!period) return;
  currentIdx = idx;

  document.getElementById('scrubber').value = idx;
  document.getElementById('time-label').textContent = period.period;
  document.getElementById('period-label').textContent = period.period;
  document.getElementById('doc-count').textContent =
    period.doc_count > 0 ? `${period.doc_count.toLocaleString()} memories` : 'quiet';

  // Git accumulation
  const gitActivity = period.git_activity || {};
  const gitTotalThisPeriod = Object.values(gitActivity).reduce((a, b) => a + b, 0);
  for (const [repo, count] of Object.entries(gitActivity)) {
    repoCumulative[repo] = (repoCumulative[repo] || 0) + count;
  }

  const ticker = document.getElementById('git-ticker');
  if (gitTotalThisPeriod > 0) {
    ticker.textContent = Object.entries(gitActivity)
      .sort((a, b) => b[1] - a[1])
      .map(([r, c]) => `${r} +${c}`)
      .join('  \u00b7  ');
  } else {
    ticker.textContent = '';
  }

  const isEmpty = period.empty || period.doc_count === 0;
  if (!isEmpty) decayClock++;

  // Build active nodes
  const activeNodes = (period.components || []).map(c => {
    const source   = c.source || 'unknown';
    const color    = srcColour(source);
    const gitBoost = getGitBoost(c.conv_title || c.label.slice(0, 48));
    const activeCommits = getActiveCommits(c.conv_title || c.label.slice(0, 48), gitActivity);
    const r = getRadius(c.conv_heat || 0, c.weight, gitBoost);
    return {
      id:            c.conv_title || c.label.slice(0, 48),
      label:         c.label,
      convTitle:     c.conv_title || c.label.slice(0, 48),
      convHeat:      c.conv_heat  || 0,
      weight:        c.weight,
      sparse:        !!c.sparse,
      source,
      topDocs:       c.top_docs || [],
      gitBoost,
      activeCommits,
      color, r,
      docCount:  period.doc_count,
      period:    period.period,
    };
  });
  const activeIds = new Set(activeNodes.map(n => n.id));

  // Update registry
  for (const node of activeNodes) {
    const existing = registry.get(node.id);
    if (existing) {
      Object.assign(existing, node);
      existing.active        = true;
      existing.lastSeenIdx   = decayClock;
      existing.targetOpacity = 1.0;
    } else {
      registry.set(node.id, {
        ...node,
        active:         true,
        lastSeenIdx:    decayClock,
        targetOpacity:  1.0,
        currentOpacity: 0.0,
        x: categoryX(node.source) + (Math.random() - 0.5) * 100,
        y: (H || 400) / 2         + (Math.random() - 0.5) * 100,
        vx: 0, vy: 0,
        _isNew: true,
      });
    }
  }

  for (const [id, entry] of registry) {
    if (!activeIds.has(id)) {
      entry.active        = false;
      entry.activeCommits = 0;
      if (!isEmpty) {
        const periodsAbsent = decayClock - entry.lastSeenIdx;
        entry.targetOpacity = Math.pow(DECAY, periodsAbsent);
      }
      if (entry.targetOpacity < MIN_OPACITY) registry.delete(id);
    }
  }

  // Sound
  const newBlobs = [...registry.values()].filter(e => e._isNew);
  newBlobs.forEach((d, i) => {
    setTimeout(() => playBlobSound(d.convHeat, d.sparse), i * 60);
    delete d._isNew;
  });

  // D3 join
  const allNodes = [...registry.values()];
  const join = blobLayer.selectAll('g.blob').data(allNodes, d => d.id);

  join.exit()
    .transition().duration(400).ease(d3.easeCubicIn)
    .style('opacity', 0).remove();

  const enterG = join.enter()
    .append('g').attr('class', 'blob')
    .attr('transform', d => `translate(${d.x},${d.y})`)
    .style('opacity', 0).style('cursor', 'pointer');

  enterG.append('circle').attr('class', 'halo')
    .attr('r', d => d.r * 1.7)
    .attr('fill', d => d.color + '12')
    .attr('filter', 'url(#glow)');

  enterG.append('circle').attr('class', 'commit-ring')
    .attr('r', d => d.r + 8)
    .attr('fill', 'none')
    .attr('stroke', '#c9a84c')
    .attr('stroke-width', 1.5)
    .attr('stroke-dasharray', '4,3')
    .style('opacity', 0);

  enterG.append('circle').attr('class', 'main')
    .attr('r', d => d.r)
    .attr('fill', d => d.sparse ? 'none' : d.color + 'c0')
    .attr('stroke', d => d.color)
    .attr('stroke-width', d => d.sparse ? 1.5 : 0)
    .attr('stroke-dasharray', d => d.sparse ? '5,4' : 'none')
    .attr('filter', d => d.convHeat > 0.5 ? 'url(#glow-soft)' : 'none');

  enterG.append('text').attr('class', 'lbl')
    .attr('text-anchor', 'middle').attr('dy', '0.35em')
    .attr('pointer-events', 'none')
    .attr('fill', 'rgba(255,255,255,0.85)')
    .attr('font-size', d => Math.max(7, Math.min(13, d.r * 0.28)) + 'px')
    .text(d => d.r > 20 ? (d.convTitle.length > 24 ? d.convTitle.slice(0, 22) + '\u2026' : d.convTitle) : '');

  const allG = enterG.merge(join);

  // Tooltip
  allG
    .on('mouseenter', function(event, d) {
      tooltip.style.opacity = '1';
      document.getElementById('tip-title').textContent = d.convTitle;
      document.getElementById('tip-heat').textContent =
        d.active
          ? `heat ${(d.convHeat * 100).toFixed(0)}% \u2014 ${d.convHeat > 0.6 ? 'deeply explored' : d.convHeat > 0.3 ? 'substantial' : 'brief'}`
          : `memory \u2014 fading (${(d.targetOpacity * 100).toFixed(0)}% strength)`;
      document.getElementById('tip-weight').textContent =
        d.sparse ? 'first appearance' : `period weight ${(d.weight * 100).toFixed(1)}%  \u00b7  ${srcLabel(d.source)}`;
      document.getElementById('tip-git').textContent =
        d.gitBoost > 0
          ? `git growth: ${Math.round(d.gitBoost)} commits total${d.activeCommits > 0 ? ` \u00b7 +${d.activeCommits} this period` : ''}`
          : '';
      document.getElementById('tip-meta').textContent =
        `${d.period} \u00b7 ${d.docCount.toLocaleString()} docs`;
    })
    .on('mousemove', e => {
      tooltip.style.left = (e.clientX + 18) + 'px';
      tooltip.style.top  = (e.clientY - 52) + 'px';
    })
    .on('mouseleave', () => { tooltip.style.opacity = '0'; });

  // Click for detail panel
  allG.on('click', function(event, d) {
    event.stopPropagation();
    showDetail(d);
  });

  // Transitions
  allG.transition().duration(700).ease(d3.easeCubicOut)
    .style('opacity', d => d.targetOpacity)
    .style('pointer-events', d => d.active ? 'all' : 'none');

  allG.select('circle.main').transition().duration(700).ease(d3.easeCubicOut)
    .attr('r', d => d.active ? d.r : d.r * 0.75)
    .attr('fill', d => d.sparse ? 'none' : d.color + 'c0');

  allG.select('circle.halo').transition().duration(700)
    .attr('r', d => d.active ? d.r * 1.7 : d.r * 1.1);

  allG.select('text.lbl').transition().duration(700)
    .attr('font-size', d => Math.max(7, Math.min(13, d.r * 0.28)) + 'px')
    .style('opacity', d => d.active ? 1 : 0);

  // Commit ring
  allG.select('circle.commit-ring')
    .attr('r', d => d.r + 8 + Math.min(d.activeCommits * 1.5, 12))
    .each(function(d) {
      if (!d.active || d.activeCommits === 0) {
        d3.select(this).transition().duration(600).style('opacity', 0);
        return;
      }
      const baseR   = d.r + 8;
      const pulseR  = baseR + Math.min(d.activeCommits * 2, 20);
      const opacity = Math.min(0.9, 0.4 + d.activeCommits * 0.05);
      const el = d3.select(this);
      el.attr('r', baseR).style('opacity', opacity)
        .transition().duration(900).ease(d3.easeQuadOut)
        .attr('r', pulseR).style('opacity', opacity * 0.3)
        .transition().duration(300)
        .attr('r', baseR + 4).style('opacity', opacity * 0.6);
    });

  // Simulation update
  sim.force('x', d3.forceX(d => categoryX(d.source)).strength(d => d.active ? 0.07 : 0.008));
  sim.force('y', d3.forceY(H / 2).strength(d => d.active ? 0.02 : 0.004));
  sim.force('charge', d3.forceManyBody().strength(d => d.active ? -d.r * 4 : -d.r));
  sim.nodes(allNodes);
  sim.alpha(0.5).restart();
}

// ── Playback ─────────────────────────────────────────────────────────────────
const PLAY_INTERVAL = 2500;
let currentIdx = 0, playing = false, playTimer = null;

function togglePlay() {
  getAudioCtx();
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '\u23f8' : '\u25b6';
  if (playing) {
    playTimer = setInterval(() => { showPeriod((currentIdx + 1) % PERIODS.length); }, PLAY_INTERVAL);
  } else {
    clearInterval(playTimer); playTimer = null;
  }
}

// ── Legend ────────────────────────────────────────────────────────────────────
(function buildLegend() {
  const el = document.getElementById('legend');
  for (const [src, colour] of Object.entries(SOURCE_COLOURS)) {
    const div = document.createElement('div');
    div.className = 'leg';
    div.innerHTML = '<div class="leg-dot" style="background:' + colour + '"></div>' + srcLabel(src);
    el.appendChild(div);
  }
  // Git commit ring
  const gitLeg = document.createElement('div');
  gitLeg.className = 'leg';
  gitLeg.innerHTML = '<div class="leg-ring"></div>git commits';
  el.appendChild(gitLeg);
})();

// ── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', resize);
document.getElementById('play-btn').addEventListener('click', togglePlay);
document.getElementById('scrubber').addEventListener('input', function() {
  getAudioCtx();
  if (playing) togglePlay();
  const targetIdx = parseInt(this.value);
  if (targetIdx < currentIdx) {
    for (const key of Object.keys(repoCumulative)) delete repoCumulative[key];
    registry.clear();
    blobLayer.selectAll('g.blob').remove();
    for (let i = 0; i < targetIdx; i++) {
      const p = PERIODS[i];
      if (!p) continue;
      for (const [repo, count] of Object.entries(p.git_activity || {})) {
        repoCumulative[repo] = (repoCumulative[repo] || 0) + count;
      }
    }
  }
  showPeriod(targetIdx);
});
document.addEventListener('keydown', e => {
  if (e.key === ' ')          { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') { getAudioCtx(); showPeriod(Math.min(currentIdx+1, PERIODS.length-1)); }
  if (e.key === 'ArrowLeft')  { getAudioCtx(); showPeriod(Math.max(currentIdx-1, 0)); }
  if (e.key === 'Escape')     { detailPanel.classList.remove('open'); }
});

// Close detail panel on canvas click
document.getElementById('canvas-wrap').addEventListener('click', () => {
  detailPanel.classList.remove('open');
});

document.getElementById('scrubber').max = PERIODS.length - 1;
resize();
showPeriod(0);
</script>
