// ── Audio ─────────────────────────────────────────────────────────────────────
let _audioCtx = null;
let soundEnabled = true;

function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

// Memory blob sound — triangle oscillator pop (from memory_map.html)
function playBlobSound(weight) {
  if (!soundEnabled) return;
  try {
    const ctx  = getAudioCtx();
    const now  = ctx.currentTime;
    const freq = 800 * Math.pow(110 / 800, weight);
    const decay = 0.06 + weight * 0.49;
    const gain  = 0.06 + weight * 0.18;
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.connect(env); env.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq * 1.2, now);
    osc.frequency.exponentialRampToValueAtTime(freq, now + 0.015);
    env.gain.setValueAtTime(gain, now);
    env.gain.exponentialRampToValueAtTime(gain * 0.3, now + 0.015);
    env.gain.exponentialRampToValueAtTime(0.0001, now + decay);
    osc.start(now); osc.stop(now + decay * 1.5);
  } catch(e) {}
}

// Book blob sound — sine wave, lower frequency, softer
function playBookSound(weight) {
  if (!soundEnabled) return;
  try {
    const ctx  = getAudioCtx();
    const now  = ctx.currentTime;
    const freq = 180 + weight * 100;  // 180–280 Hz
    const decay = 0.3;
    const gain  = 0.04 + weight * 0.08;
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.connect(env); env.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.85, now + decay);
    env.gain.setValueAtTime(gain, now);
    env.gain.exponentialRampToValueAtTime(0.0001, now + decay);
    osc.start(now); osc.stop(now + decay + 0.05);
  } catch(e) {}
}

// ── Book helpers ──────────────────────────────────────────────────────────────
function stageAtDate(book, dateStr) {
  const ms = book.milestones;
  if (ms.published && dateStr >= ms.published) return 'published';
  if (ms.kdp       && dateStr >= ms.kdp)       return 'kdp';
  if (ms.cover     && dateStr >= ms.cover)     return 'cover';
  return 'drafting';
}

function wcAtDate(book, dateStr) {
  let wc = 0;
  for (const e of book.entries) {
    if (e.date <= dateStr && e.word_count > wc) wc = e.word_count;
  }
  return wc;
}

function bookRadius(wc) {
  if (!wc) return 8;
  return Math.max(8, Math.min(50, 8 + (Math.log10(wc + 1) / Math.log10(150001)) * 42));
}

function stableJitter(title) {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) >>> 0;
  return ((h % 1000) / 1000 - 0.5);
}

function fmtWc(n) {
  if (!n) return 'no word count yet';
  return n >= 1000 ? (n / 1000).toFixed(1) + 'k words' : n + ' words';
}

function fmtStage(s) {
  return {drafting:'Drafting',cover:'Cover stage',kdp:'KDP / Print',published:'Published'}[s] || s;
}

// ── Memory blob helpers ──────────────────────────────────────────────────────
function categoryX(color) {
  const w = W || 800;
  if (color === '#1D9E75') return w * 0.28;
  if (color === '#534AB7') return w * 0.72;
  if (color === '#BA7517') return w * 0.50;
  if (color === '#E8A020') return w * 0.50;
  return w * 0.50;
}

function memRadius(convHeat, weight) {
  const base  = 10 + convHeat * 65;
  const boost = Math.sqrt(weight) * 0.3;
  return Math.max(10, Math.min(85, base + base * boost));
}

let W = 0, H = 0;

function bookX(book) {
  const jitter = stableJitter(book.title + 'x') * (W * 0.12);
  if (book.pen_name && book.pen_name.toLowerCase().includes('talla'))
    return W * 0.72 + jitter;
  return W * 0.30 + jitter;
}

function bookY(title) {
  return H / 2 + stableJitter(title) * H * 0.6;
}

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth; H = wrap.clientHeight;
  svg.attr('viewBox', `0 0 ${W} ${H}`);
  sim.force('center', d3.forceCenter(W/2, H/2).strength(0.01));
  sim.alpha(0.3).restart();
}

// ── Force simulation ─────────────────────────────────────────────────────────
const sim = d3.forceSimulation([])
  .force('charge',  d3.forceManyBody().strength(d => d.active ? -d.r * 3.5 : -d.r * 1.2))
  .force('collide', d3.forceCollide().radius(d => d.active ? d.r + 4 : d.r * 0.6 + 2).strength(0.6))
  .force('center',  d3.forceCenter(400, 300).strength(0.01))
  .force('x',       d3.forceX(d => d.tx).strength(0.06))
  .force('y',       d3.forceY(d => d.ty).strength(0.04))
  .alphaDecay(0.02).velocityDecay(0.5)
  .on('tick', () => {
    blobLayer.selectAll('g.blob')
      .attr('transform', d => `translate(${d.x.toFixed(1)},${d.y.toFixed(1)})`);
  });

// ── Registries ───────────────────────────────────────────────────────────────
const memRegistry  = new Map();  // memory blobs
const bookRegistry = new Map();  // book blobs
let decayClock = 0;

// ── Show period ──────────────────────────────────────────────────────────────
let currentIdx = 0;

function showPeriod(idx) {
  const period = PERIODS[idx];
  if (!period) return;
  currentIdx = idx;

  const dateStr = period.period;
  document.getElementById('scrubber').value = idx;
  document.getElementById('time-label').textContent = dateStr;
  document.getElementById('period-label').textContent = dateStr;
  document.getElementById('doc-count').textContent =
    period.doc_count > 0 ? `${period.doc_count.toLocaleString()} memories` : '';

  const isEmpty = period.empty || period.doc_count === 0;
  if (!isEmpty) decayClock++;

  // ── Memory blobs ─────────────────────────────────────────────────────────
  const activeMemNodes = (period.components || []).map(c => {
    const color = getColor(c.label);
    const r     = memRadius(c.conv_heat || 0, c.weight);
    return {
      id:        'mem_' + (c.conv_title || c.label.slice(0, 48)),
      blobType:  'memory',
      label:     c.label,
      convTitle: c.conv_title || c.label.slice(0, 48),
      convHeat:  c.conv_heat  || 0,
      weight:    c.weight,
      sparse:    !!c.sparse,
      source:    c.source || 'unknown',
      color, r,
      docCount:  period.doc_count,
      period:    dateStr,
    };
  });
  const activeMemIds = new Set(activeMemNodes.map(n => n.id));

  for (const node of activeMemNodes) {
    const existing = memRegistry.get(node.id);
    if (existing) {
      Object.assign(existing, node);
      existing.active        = true;
      existing.lastSeenIdx   = decayClock;
      existing.targetOpacity = 1.0;
    } else {
      memRegistry.set(node.id, {
        ...node,
        active:         true,
        lastSeenIdx:    decayClock,
        targetOpacity:  1.0,
        currentOpacity: 0.0,
        tx: categoryX(node.color) + (Math.random() - 0.5) * 100,
        ty: (H || 400) / 2       + (Math.random() - 0.5) * 100,
        x:  categoryX(node.color) + (Math.random() - 0.5) * 100,
        y:  (H || 400) / 2       + (Math.random() - 0.5) * 100,
        vx: 0, vy: 0,
        _isNew: true,
      });
    }
  }

  for (const [id, entry] of memRegistry) {
    if (!activeMemIds.has(id)) {
      entry.active = false;
      if (!isEmpty) {
        const periodsAbsent = decayClock - entry.lastSeenIdx;
        entry.targetOpacity = Math.pow(DECAY, periodsAbsent);
      }
      if (entry.targetOpacity < MIN_OPACITY) memRegistry.delete(id);
    }
  }

  // ── Book blobs ───────────────────────────────────────────────────────────
  const activeBooks = BOOKS.filter(b => b.first_entry && b.first_entry.slice(0, 7) <= dateStr);
  for (const book of activeBooks) {
    const wc    = wcAtDate(book, dateStr + '-31');
    const stage = stageAtDate(book, dateStr + '-31');
    const r     = bookRadius(wc);
    const fill  = STAGE_COLOUR[stage] || '#4a9eff';
    const bid   = 'book_' + book.title;

    if (bookRegistry.has(bid)) {
      const node = bookRegistry.get(bid);
      node.wc    = wc;
      node.stage = stage;
      node.r     = r;
      node.fill  = fill;
      node.tx    = bookX(book);
      node.ty    = bookY(book.title);
    } else {
      bookRegistry.set(bid, {
        id:       bid,
        blobType: 'book',
        title:    book.title,
        penName:  book.pen_name,
        wc, stage, r, fill,
        active: true,
        targetOpacity: 1.0,
        tx: bookX(book), ty: bookY(book.title),
        x:  bookX(book) + (Math.random() - 0.5) * 40,
        y:  bookY(book.title) + (Math.random() - 0.5) * 40,
        vx: 0, vy: 0,
        book,
        _isNew: true,
      });
    }
  }

  // ── Sound for new blobs ──────────────────────────────────────────────────
  let soundIdx = 0;
  for (const entry of memRegistry.values()) {
    if (entry._isNew) {
      const w = entry.convHeat || 0;
      setTimeout(() => playBlobSound(w), soundIdx * 60);
      delete entry._isNew;
      soundIdx++;
    }
  }
  for (const entry of bookRegistry.values()) {
    if (entry._isNew) {
      const w = entry.r / 50;
      setTimeout(() => playBookSound(Math.min(w, 1)), soundIdx * 60);
      delete entry._isNew;
      soundIdx++;
    }
  }

  // ── Merge all nodes ────────────────────────────────────────────────────
  const allNodes = [...memRegistry.values(), ...bookRegistry.values()];

  // ── D3 join ────────────────────────────────────────────────────────────
  const join = blobLayer.selectAll('g.blob').data(allNodes, d => d.id);

  join.exit()
    .transition().duration(400).ease(d3.easeCubicIn)
    .style('opacity', 0)
    .remove();

  const enterG = join.enter()
    .append('g').attr('class', 'blob')
    .attr('transform', d => `translate(${d.x},${d.y})`)
    .style('opacity', 0)
    .style('cursor', 'pointer');

  // Halo — memory blobs only
  enterG.append('circle').attr('class', 'halo')
    .attr('r', d => d.blobType === 'memory' ? d.r * 1.7 : 0)
    .attr('fill', d => d.blobType === 'memory' ? (d.color || '#5F5E5A') + '12' : 'none')
    .attr('filter', d => d.blobType === 'memory' ? 'url(#glow)' : 'none');

  // Main circle
  enterG.append('circle').attr('class', 'main')
    .attr('r', d => d.r)
    .each(function(d) {
      const el = d3.select(this);
      if (d.blobType === 'book') {
        // Dashed ring, no fill
        el.attr('fill', 'none')
          .attr('stroke', d.fill)
          .attr('stroke-width', 2.5)
          .attr('stroke-dasharray', '6,3');
      } else {
        // Filled circle with glow
        el.attr('fill', d.sparse ? 'none' : (d.color || '#5F5E5A') + 'c0')
          .attr('stroke', d.sparse ? (d.color || '#5F5E5A') : 'none')
          .attr('stroke-width', d.sparse ? 1.5 : 0)
          .attr('stroke-dasharray', d.sparse ? '5,4' : 'none')
          .attr('filter', (d.convHeat || 0) > 0.5 ? 'url(#glow-soft)' : 'none');
      }
    });

  enterG.append('text').attr('class', 'lbl')
    .attr('text-anchor', 'middle').attr('dy', '0.35em')
    .attr('pointer-events', 'none')
    .attr('fill', 'rgba(255,255,255,0.85)')
    .attr('font-size', d => Math.max(7, Math.min(13, d.r * 0.28)) + 'px');

  const allG = enterG.merge(join);

  // ── Tooltip ──────────────────────────────────────────────────────────────
  allG
    .on('mouseenter', function(event, d) {
      tooltip.style.opacity = '1';
      if (d.blobType === 'memory') {
        document.getElementById('tip-title').textContent = d.convTitle;
        const l1 = document.getElementById('tip-line1');
        l1.textContent = 'Source: ' + srcLabel(d.source || 'unknown');
        l1.style.color = srcColour(d.source || 'unknown');
        document.getElementById('tip-line2').textContent =
          `Weight: ${(d.weight * 100).toFixed(1)}%  ·  ${d.period}`;
        document.getElementById('tip-meta').textContent = '';
      } else {
        document.getElementById('tip-title').textContent = d.title;
        const l1 = document.getElementById('tip-line1');
        l1.textContent = fmtStage(d.stage) + '  ·  ' + (d.penName || '');
        l1.style.color = d.fill;
        document.getElementById('tip-line2').textContent = fmtWc(d.wc);
        document.getElementById('tip-meta').textContent =
          'started ' + (d.book.first_entry || '?');
      }
    })
    .on('mousemove', e => {
      tooltip.style.left = (e.clientX + 18) + 'px';
      tooltip.style.top  = (e.clientY - 52) + 'px';
    })
    .on('mouseleave', () => { tooltip.style.opacity = '0'; });

  // ── Transitions ──────────────────────────────────────────────────────────
  allG.transition().duration(700).ease(d3.easeCubicOut)
    .style('opacity', d => d.targetOpacity)
    .style('pointer-events', d => (d.active !== false) ? 'all' : 'none');

  allG.select('circle.main').transition().duration(700).ease(d3.easeCubicOut)
    .attr('r', d => (d.active !== false) ? d.r : d.r * 0.75)
    .each(function(d) {
      const el = d3.select(this);
      if (d.blobType === 'book') {
        el.attr('stroke', d.fill).attr('stroke-dasharray', '6,3');
      } else {
        el.attr('fill', d.sparse ? 'none' : (d.color || '#5F5E5A') + 'c0');
      }
    });

  allG.select('circle.halo').transition().duration(700)
    .attr('r', d => d.blobType === 'memory'
      ? ((d.active !== false) ? d.r * 1.7 : d.r * 1.1)
      : 0);

  allG.select('text.lbl')
    .text(d => {
      if (d.r < 20) return '';
      const txt = d.blobType === 'memory' ? d.convTitle : d.title;
      return txt.length > 22 ? txt.slice(0, 20) + '…' : txt;
    })
    .transition().duration(700)
    .attr('font-size', d => Math.max(7, Math.min(13, d.r * 0.28)) + 'px')
    .style('opacity', d => (d.active !== false) && d.r > 20 ? 1 : 0);

  // ── Simulation update ──────────────────────────────────────────────────
  sim.force('x', d3.forceX(d => d.tx).strength(d => (d.active !== false) ? 0.06 : 0.008));
  sim.force('y', d3.forceY(d => d.ty).strength(d => (d.active !== false) ? 0.04 : 0.004));
  sim.force('charge', d3.forceManyBody().strength(d => (d.active !== false) ? -d.r * 3.5 : -d.r));
  sim.nodes(allNodes);
  sim.alpha(0.5).restart();
}

// ── Playback ─────────────────────────────────────────────────────────────────
let playing = false, playTimer = null;

function togglePlay() {
  getAudioCtx();
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';
  if (playing) {
    playTimer = setInterval(() => {
      showPeriod((currentIdx + 1) % PERIODS.length);
    }, PLAY_INTERVAL);
  } else {
    clearInterval(playTimer); playTimer = null;
  }
}

// ── Legend ────────────────────────────────────────────────────────────────────
(function buildLegend() {
  const el = document.getElementById('legend');
  // Memory source dots
  for (const [src, colour] of Object.entries(SOURCE_COLOURS)) {
    const div = document.createElement('div');
    div.className = 'leg';
    div.innerHTML = '<div class="leg-dot" style="background:' + colour + '"></div>' + srcLabel(src);
    el.appendChild(div);
  }
  // Divider
  const divider = document.createElement('div');
  divider.className = 'leg-divider';
  el.appendChild(divider);
  // Book stage rings
  for (const [stage, colour] of Object.entries(STAGE_COLOUR)) {
    const div = document.createElement('div');
    div.className = 'leg';
    div.innerHTML = '<div class="leg-ring" style="border-color:' + colour + '"></div>' + stage;
    el.appendChild(div);
  }
})();

// ── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', resize);
document.getElementById('play-btn').addEventListener('click', togglePlay);
document.getElementById('scrubber').addEventListener('input', function() {
  getAudioCtx();
  if (playing) togglePlay();
  const targetIdx = parseInt(this.value);
  if (targetIdx < currentIdx) {
    memRegistry.clear();
    bookRegistry.clear();
    blobLayer.selectAll('g.blob').remove();
    decayClock = 0;
    // Replay silently up to targetIdx
    const origSound = soundEnabled;
    soundEnabled = false;
    for (let i = 0; i <= targetIdx; i++) showPeriod(i);
    soundEnabled = origSound;
  } else {
    showPeriod(targetIdx);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === ' ')          { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') { getAudioCtx(); showPeriod(Math.min(currentIdx+1, PERIODS.length-1)); }
  if (e.key === 'ArrowLeft')  { getAudioCtx(); showPeriod(Math.max(currentIdx-1, 0)); }
});

document.getElementById('scrubber').max = PERIODS.length - 1;
resize();
showPeriod(0);
</script>
