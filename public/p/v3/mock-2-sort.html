<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock 2 — One statement at a time</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .face-btn {
    transition: transform 0.12s, background 0.12s, border-color 0.12s;
  }
  .face-btn:active { transform: scale(0.92); }
  .face-btn:hover {
    transform: translateY(-3px);
  }
</style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col">

  <!-- Top bar with progress -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-sm font-bold text-teal-400">Phones in Schools</span>
      </div>
      <span class="text-sm text-slate-400 font-medium">
        <span class="text-teal-400">7</span> / 30
      </span>
    </div>
    <!-- Thin progress bar -->
    <div class="h-1 bg-slate-800">
      <div class="h-full bg-teal-500 transition-all" style="width: 23%"></div>
    </div>
  </header>

  <!-- Statement card -->
  <main class="flex-1 flex flex-col">

    <div class="flex-1 flex items-center justify-center px-6 py-8">
      <div class="max-w-2xl w-full text-center">
        <p class="text-slate-500 text-xs uppercase tracking-widest mb-6">How do you feel about this?</p>
        <p class="text-2xl md:text-3xl font-medium leading-relaxed text-white">
          &ldquo;Looking things up on my phone during class helps me learn faster.&rdquo;
        </p>
      </div>
    </div>

    <!-- Face buttons -->
    <div class="px-4 pb-8">
      <div class="max-w-2xl mx-auto">

        <div class="flex justify-between items-end gap-2 md:gap-4">

          <!-- Strongly disagree -->
          <button class="face-btn flex-1 flex flex-col items-center gap-2 py-4 px-1 rounded-2xl bg-rose-500/10 hover:bg-rose-500/25 border-2 border-rose-500/30 hover:border-rose-400">
            <span class="text-4xl md:text-5xl">😠</span>
            <span class="text-[10px] md:text-xs text-rose-300 font-semibold leading-tight">Strongly<br>disagree</span>
          </button>

          <!-- Disagree -->
          <button class="face-btn flex-1 flex flex-col items-center gap-2 py-4 px-1 rounded-2xl bg-orange-500/10 hover:bg-orange-500/25 border-2 border-orange-500/30 hover:border-orange-400">
            <span class="text-4xl md:text-5xl">🙁</span>
            <span class="text-[10px] md:text-xs text-orange-300 font-semibold leading-tight">Disagree</span>
          </button>

          <!-- Neutral -->
          <button class="face-btn flex-1 flex flex-col items-center gap-2 py-4 px-1 rounded-2xl bg-slate-500/10 hover:bg-slate-500/25 border-2 border-slate-500/30 hover:border-slate-400">
            <span class="text-4xl md:text-5xl">😐</span>
            <span class="text-[10px] md:text-xs text-slate-300 font-semibold leading-tight">Neutral</span>
          </button>

          <!-- Agree -->
          <button class="face-btn flex-1 flex flex-col items-center gap-2 py-4 px-1 rounded-2xl bg-teal-500/10 hover:bg-teal-500/25 border-2 border-teal-500/30 hover:border-teal-400">
            <span class="text-4xl md:text-5xl">🙂</span>
            <span class="text-[10px] md:text-xs text-teal-300 font-semibold leading-tight">Agree</span>
          </button>

          <!-- Strongly agree -->
          <button class="face-btn flex-1 flex flex-col items-center gap-2 py-4 px-1 rounded-2xl bg-emerald-500/10 hover:bg-emerald-500/25 border-2 border-emerald-500/30 hover:border-emerald-400">
            <span class="text-4xl md:text-5xl">😄</span>
            <span class="text-[10px] md:text-xs text-emerald-300 font-semibold leading-tight">Strongly<br>agree</span>
          </button>

        </div>

        <!-- Back button -->
        <div class="mt-8 flex justify-center">
          <button class="text-slate-500 hover:text-slate-300 text-sm flex items-center gap-1">
            &larr; Back
          </button>
        </div>

      </div>
    </div>

  </main>

</body>
</html>
