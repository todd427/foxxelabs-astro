<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock 3 — Almost done</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .face-btn { transition: transform 0.12s; }
  .face-btn:hover { transform: translateY(-3px); }
</style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col">

  <!-- Top bar showing nearly done -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <span class="text-sm font-bold text-teal-400">Phones in Schools</span>
      <span class="text-sm text-slate-400 font-medium">
        <span class="text-teal-400">30</span> / 30
      </span>
    </div>
    <div class="h-1 bg-slate-800">
      <div class="h-full bg-emerald-500" style="width: 100%"></div>
    </div>
  </header>

  <!-- Last statement just answered, transitioning to results -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 py-8">
    <div class="max-w-xl text-center">

      <div class="mb-6">
        <span class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-500">
          <span class="text-3xl">✓</span>
        </span>
      </div>

      <h2 class="text-2xl md:text-3xl font-bold mb-3">All 30 done.</h2>
      <p class="text-slate-400 mb-8 leading-relaxed">
        Working out which viewpoint your answers most resemble&hellip;
      </p>

      <!-- Spinner / loading dots -->
      <div class="flex justify-center gap-2 mb-10">
        <span class="w-3 h-3 rounded-full bg-teal-500 animate-pulse"></span>
        <span class="w-3 h-3 rounded-full bg-teal-500 animate-pulse" style="animation-delay: 0.2s"></span>
        <span class="w-3 h-3 rounded-full bg-teal-500 animate-pulse" style="animation-delay: 0.4s"></span>
      </div>

      <p class="text-slate-600 text-xs">
        This page would auto-advance to results in ~1 second
      </p>

    </div>
  </main>

</body>
</html>
