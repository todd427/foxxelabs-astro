<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
<title id="t">Inside a 3,184-parameter language model</title>
<desc id="d">Left: attention weights of the model's two heads on the sentence "the big dog chased the small cat .", one cell per query-key pair. Head 0 mostly attends to the word itself; head 1 sends later words back to "chased". Right: the model's prediction after "the cat sat on the" at three stages. After embedding alone it is flat; after attention it names mat, white and rug; the output is mat, rug and roof.</desc>
<style>.s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace}</style>
