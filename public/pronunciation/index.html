<!DOCTYPE html>
<html lang="ga">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoxxeLabs — Pronunciation Guide</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0d0e10;
    --bg2:     #141618;
    --border:  #2a2e35;
    --border2: #3a3f48;
    --text:    #d4d7dc;
    --text2:   #8a8f99;
    --text3:   #555c66;
    --teal:    #3eada0;
    --teal-bg: #091614;
    --teal-bd: #1e5a55;
    --amber:   #d4950f;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', 'Fira Mono', monospace;
    font-size: 13px;
    padding: 16px 20px 20px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .header-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
  }
  .voice-legend {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .legend-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .dot-orla { background: var(--teal); }
  .dot-colm { background: var(--amber); }
  table { width: 100%; border-collapse: collapse; }
  tr { border-bottom: 1px solid var(--border); }
  tr:last-child { border-bottom: none; }
  td { padding: 9px 6px; vertical-align: middle; }
  td.name { font-weight: 500; color: var(--text); width: 110px; }
  td.phonetic { color: var(--teal); width: 120px; font-size: 12px; }
  td.ipa { color: var(--text3); font-size: 11px; width: 150px; }
  td.meaning { color: var(--text2); font-size: 11px; }
  .speak-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 24px; height: 22px;
    cursor: pointer;
    font-size: 9px;
    color: var(--teal);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, opacity 0.15s;
    margin-right: 3px;
  }
  .speak-btn.colm-btn { color: var(--amber); }
  .speak-btn:hover { border-color: var(--border2); }
  .speak-btn.playing { opacity: 0.4; pointer-events: none; }
  .note {
    margin-top: 14px;
    font-size: 10px;
    color: var(--text3);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .note a { color: var(--teal); text-decoration: none; }
</style>
</head>
<body>
<div class="header">
  <span class="header-label">Click ▶ to hear</span>
  <div class="voice-legend">
    <span><span class="legend-dot dot-orla"></span>Orla (f)</span>
    <span><span class="legend-dot dot-colm"></span>Colm (m)</span>
  </div>
</div>
<table>
  <tbody id="tbody">
  </tbody>
</table>
<p class="note">Native Irish voices · Azure Neural ga-IE · Audio generated offline, served as static MP3 · powered by <a href="https://ga-say.sionnach.ie">ga-say</a></p>
<script>
const BASE = '/pronunciation/audio/';
let _cur = null;

async function loadEntries() {
  try {
    const r = await fetch('/pronunciation/pronunciations.json');
    const data = await r.json();
    const tbody = document.getElementById('tbody');
    data.entries.forEach(e => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="name">${e.name}</td>
        <td class="phonetic">${e.phonetic}</td>
        <td class="ipa">${e.ipa}</td>
        <td class="meaning">
          <button class="speak-btn" onclick="speak(this,'${e.slug}','orla')" title="Orla">▶</button>
          <button class="speak-btn colm-btn" onclick="speak(this,'${e.slug}','colm')" title="Colm">▶</button>
          ${e.meaning}
        </td>`;
      tbody.appendChild(tr);
    });
  } catch(err) {
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="4" style="color:var(--text3);padding:12px">Could not load entries.</td></tr>';
  }
}

function speak(btn, slug, voice) {
  if (_cur) { _cur.pause(); _cur = null; }
  document.querySelectorAll('.speak-btn.playing').forEach(b => b.classList.remove('playing'));
  btn.classList.add('playing');
  const audio = new Audio(BASE + slug + '-' + voice + '.mp3');
  _cur = audio;
  audio.onended = () => { btn.classList.remove('playing'); _cur = null; };
  audio.onerror = () => {
    btn.classList.remove('playing'); _cur = null;
    // fallback: Web Speech with Irish locale
    const u = new SpeechSynthesisUtterance(slug);
    u.lang = 'ga'; u.rate = 0.75;
    window.speechSynthesis.speak(u);
  };
  audio.play();
}

loadEntries();
</script>
</body>
</html>
