<text x="6" y="26" font-size="20" font-weight="700" fill="#222">How much text does an AI read?</text>
<g stroke="#DDD8CF" stroke-width="1"><line x1="92" y1="392" x2="704" y2="392"/><line x1="92" y1="336" x2="704" y2="336"/><line x1="92" y1="280" x2="704" y2="280"/><line x1="92" y1="224" x2="704" y2="224"/><line x1="92" y1="168" x2="704" y2="168"/><line x1="92" y1="112" x2="704" y2="112"/><line x1="92" y1="56" x2="704" y2="56"/></g><g font-size="11" fill="#777" text-anchor="end"><text x="84" y="396">10⁸</text><text x="84" y="340">10⁹</text><text x="84" y="284">10¹⁰</text><text x="84" y="228">10¹¹</text><text x="84" y="172">10¹²</text><text x="84" y="116">10¹³</text><text x="84" y="60">10¹⁴</text></g><rect x="149" y="352.9" width="90" height="39.1" fill="#0F6E56"/><rect x="353" y="112.0" width="90" height="280.0" fill="#9C8A6B"/><rect x="557" y="89.7" width="90" height="302.3" fill="#8C3B1B"/>
<g font-size="11.5" fill="#333" text-anchor="middle"><text x="194" y="332.9">~0.5 billion</text><text x="194" y="346.9">words</text><text x="398" y="92.0">~10 trillion</text><text x="398" y="106.0">words</text><text x="602" y="69.7">~25 trillion</text><text x="602" y="83.7">words</text></g>
