name = "q-sort-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Bind the KV namespace where sort arrays are stored.
# Replace `id` with the value printed by:
#   wrangler kv namespace create Q_SORTS
[[kv_namespaces]]
binding = "Q_SORTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Public hostname. Cloudflare auto-creates the DNS record on deploy
# because foxxelabs.ie is in the same account.
[[routes]]
pattern = "q-sort-api.foxxelabs.ie/*"
zone_name = "foxxelabs.ie"

# No secrets needed — the Worker IS the API. No third-party calls.
